<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1628">
    <title>CMSys Mobile Light | Fast Field Entry</title>

    <link rel="preconnect" href="https://ncw-ps-operations-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preconnect" href="https://ce-admin-panel2025-default-rtdb.firebaseio.com">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Pre-compiled Tailwind Static CSS -->
    <link rel="stylesheet" href="tailwind-static.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Sinhala", sans-serif;
            background-color: #070e1c;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            touch-action: manipulation;
        }
        .touch-scroll {
            -webkit-overflow-scrolling: touch;
        }
        .active-tab {
            color: #2dd4bf !important;
            border-bottom: 2px solid #2dd4bf;
        }
        .active-scale:active {
            transform: scale(0.96);
        }
        input, select, textarea {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none pb-16">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-[#0a1628] border-b border-teal-500/30 px-3 py-2 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg overflow-hidden flex items-center justify-center bg-slate-900 border border-teal-500/30 p-0.5 shrink-0">
                <img src="logo.png" alt="Navy Crest" class="w-full h-full object-contain">
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 class="text-xs font-black tracking-tight text-white">CMSys</h1>
                    <span class="text-[9px] font-black bg-teal-500/20 text-teal-300 border border-teal-500/40 px-1.5 py-0.2 rounded uppercase">LIGHT</span>
                </div>
                <p class="text-[9px] text-slate-400 font-medium">Ultra-Fast Field Input</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <button type="button" onclick="refreshLightData()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 active-scale" title="Refresh">
                🔄
            </button>
        </div>
    </header>

    <!-- ZONE & DATE BAR -->
    <section class="bg-slate-900/90 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2">
        <!-- Zone Selector -->
        <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <span class="text-xs">📍</span>
            <select id="mlZoneSelect" onchange="changeLightZone(this.value)" class="bg-slate-800 text-teal-300 font-bold text-xs border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:border-teal-500 truncate w-full">
                <!-- Injected via JS -->
            </select>
        </div>

        <!-- Date Display / Switcher -->
        <div class="flex items-center gap-1 bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg shrink-0">
            <span class="text-xs">📅</span>
            <input type="date" id="mlDatePicker" onchange="changeLightDate(this.value)" class="bg-transparent text-[11px] font-bold text-slate-200 border-0 p-0 focus:ring-0 cursor-pointer">
        </div>
    </section>

    <!-- MAIN VIEWS CONTAINER -->
    <main class="flex-1 p-3 space-y-3 touch-scroll overflow-y-auto">

        <!-- TAB 1: ACTIVE TASKS & PROGRESS (Default) -->
        <div id="viewTasks" class="space-y-2.5">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <span>📋</span> Active Work Orders
                </h2>
                <span id="mlTaskCount" class="text-[10px] font-bold bg-slate-800 text-teal-300 px-2 py-0.5 rounded-full border border-slate-700">0</span>
            </div>

            <!-- Task List Container -->
            <div id="mlTaskList" class="space-y-2">
                <!-- Skeleton Loader -->
                <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 animate-pulse space-y-2">
                    <div class="h-3 bg-slate-800 rounded w-3/4"></div>
                    <div class="h-2 bg-slate-800 rounded w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: NEW WORK ORDER (Fast 3-Field Creation) -->
        <div id="viewNewTask" class="hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-3 shadow-lg">
                <h2 class="text-xs font-black uppercase tracking-wider text-teal-300 flex items-center gap-1.5 border-b border-slate-800 pb-2">
                    <span>➕</span> Create New Work Order
                </h2>

                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Work Description / Title *</label>
                    <textarea id="mlNewDesc" rows="3" placeholder="Enter work order description..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-teal-400"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Zone</label>
                        <select id="mlNewZone" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-bold focus:outline-none focus:border-teal-400">
                            <!-- Injected -->
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Priority</label>
                        <select id="mlNewPriority" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-bold focus:outline-none focus:border-teal-400">
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>

                <button type="button" onclick="submitNewLightTask()" class="w-full py-2.5 bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-black text-xs rounded-xl shadow-md active-scale flex items-center justify-center gap-1.5">
                    <span>🚀</span> Create & Activate Work Order
                </button>
            </div>
        </div>

        <!-- TAB 3: LABOUR ASSIGNMENT & EVALUATION -->
        <div id="viewAssign" class="hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-3 shadow-lg">
                <h2 class="text-xs font-black uppercase tracking-wider text-teal-300 flex items-center gap-1.5 border-b border-slate-800 pb-2">
                    <span>👥</span> Daily Labour Assign & Evaluate
                </h2>

                <!-- Task Select -->
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Select Work Order *</label>
                    <select id="mlAssignWoSelect" onchange="onAssignWoChanged()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-bold focus:outline-none focus:border-teal-400">
                        <option value="">-- Choose Active Work Order --</option>
                    </select>
                </div>

                <!-- Sailors Checklist for Selected Zone -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Assign Sailors (Zone Crew)</label>
                        <span id="mlAssignSelectedCount" class="text-[10px] text-teal-400 font-bold">0 Selected</span>
                    </div>
                    <div id="mlSailorList" class="max-h-60 overflow-y-auto touch-scroll divide-y divide-slate-800 border border-slate-800 rounded-xl bg-slate-950/60 p-1 space-y-0.5">
                        <!-- Sailors injected -->
                    </div>
                </div>

                <!-- Commit Button -->
                <button type="button" onclick="commitLightLabour()" class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-xs rounded-xl shadow-md active-scale flex items-center justify-center gap-1.5">
                    <span>✅</span> Commit Daily Labour for Today
                </button>
            </div>
        </div>

        <!-- TAB 4: BASIC INVENTORY -->
        <div id="viewInventory" class="hidden space-y-2.5">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <span>📦</span> Material & Tool Stock
                </h2>
            </div>

            <!-- Search -->
            <input type="text" id="mlInvSearch" oninput="filterLightInventory()" placeholder="Search material or tool..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-teal-500">

            <div id="mlInvList" class="space-y-1.5 max-h-[65vh] overflow-y-auto touch-scroll">
                <!-- Injected -->
            </div>
        </div>

    </main>

    <!-- BOTTOM FIXED NAV BAR -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0a1628] border-t border-slate-800 flex items-center justify-around px-1 py-1.5 shadow-2xl">
        <button type="button" onclick="switchLightTab('tasks')" id="tabBtnTasks" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white px-3 py-1 rounded-lg active-tab active-scale">
            <span class="text-base">📋</span>
            <span class="text-[9px] font-bold">Tasks</span>
        </button>
        <button type="button" onclick="switchLightTab('new')" id="tabBtnNew" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white px-3 py-1 rounded-lg active-scale">
            <span class="text-base">➕</span>
            <span class="text-[9px] font-bold">New Job</span>
        </button>
        <button type="button" onclick="switchLightTab('assign')" id="tabBtnAssign" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white px-3 py-1 rounded-lg active-scale">
            <span class="text-base">👥</span>
            <span class="text-[9px] font-bold">Assign</span>
        </button>
        <button type="button" onclick="switchLightTab('inventory')" id="tabBtnInventory" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white px-3 py-1 rounded-lg active-scale">
            <span class="text-base">📦</span>
            <span class="text-[9px] font-bold">Stock</span>
        </button>
    </nav>

    <!-- TOAST NOTIFICATION -->
    <div id="mlToast" class="fixed bottom-16 left-4 right-4 z-50 p-2.5 rounded-xl bg-slate-900 border border-teal-500/50 text-white text-xs font-bold shadow-2xl flex items-center gap-2 transform translate-y-24 transition-transform duration-200 pointer-events-none">
        <span id="mlToastIcon">✅</span>
        <span id="mlToastMsg" class="flex-1">Notification</span>
    </div>

    <!-- SCRIPT INCLUSION -->
    <script src="mobile-light.js?v=1.0.0"></script>
</body>
</html>
