<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1628">
    <title>CMSys Mobile | Quick Entry Portal</title>
    
    <!-- Preconnect to Firebase -->
    <link rel="preconnect" href="https://ncw-ps-operations-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preconnect" href="https://ce-admin-panel2025-default-rtdb.firebaseio.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Tailwind CSS (Browser runtime for maximum speed & lightness) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: #0b1329;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        /* Native touch momentum scrolling */
        .touch-scroll {
            -webkit-overflow-scrolling: touch;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .active-scale:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none pb-safe">

    <!-- TOP APP BAR -->
    <header class="sticky top-0 z-40 bg-[#0a1628]/95 backdrop-blur border-b border-teal-500/20 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-600 to-cyan-500 flex items-center justify-center font-black text-white text-lg shadow-md shadow-teal-900/40">
                ⚡
            </div>
            <div>
                <h1 class="text-sm font-black tracking-tight text-white flex items-center gap-1.5">
                    CMSys Mobile
                    <span class="text-[9px] font-bold bg-teal-500/20 text-teal-300 border border-teal-500/30 px-1.5 py-0.2 rounded-full uppercase tracking-wider">Fast</span>
                </h1>
                <p class="text-[10px] text-slate-400 font-medium">Civil Engineering Quick Portal</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Back to Desktop / Full Admin button -->
            <a href="index.html" class="px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-[11px] font-bold text-slate-300 flex items-center gap-1 active-scale">
                <span>🖥️</span> Full App
            </a>
        </div>
    </header>

    <!-- ZONE / WORKSHOP SELECTOR & STATUS BAR -->
    <section class="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between gap-3">
        <div class="flex-1 flex items-center gap-2">
            <label class="text-[11px] font-black uppercase text-teal-400 shrink-0">Zone / Shop:</label>
            <select id="mZoneSelect" onchange="onZoneChange(this.value)" class="w-full bg-slate-800 border border-teal-500/40 text-teal-200 text-xs font-bold rounded-lg px-2.5 py-1.5 outline-none focus:ring-1 focus:ring-teal-400 cursor-pointer">
                <!-- Populated dynamically from Firebase settings / standard zones -->
            </select>
        </div>

        <div id="mSyncStatus" class="flex items-center gap-1 text-[10px] text-emerald-400 font-semibold shrink-0">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Live</span>
        </div>
    </section>

    <!-- MAIN CONTENT: LIST OR DETAIL SHEET -->
    <main class="flex-1 overflow-y-auto touch-scroll p-4 space-y-4">

        <!-- SEARCH BAR -->
        <div class="flex items-center gap-2">
            <div class="relative flex-1">
                <input type="text" id="mSearchWo" oninput="filterWorkOrders()" placeholder="Search work orders..." class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 pl-8 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-teal-500">
                <span class="absolute left-2.5 top-2.5 text-xs text-slate-400">🔍</span>
            </div>
            <button onclick="refreshData(true)" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 font-bold text-xs p-2 rounded-xl flex items-center justify-center active-scale shrink-0" title="Refresh">
                🔄
            </button>
        </div>

        <!-- WORK ORDERS LIST VIEW -->
        <div id="mWoListContainer">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400" id="mWoListTitle">Work Orders (Loading...)</h2>
                <span id="mWoCountBadge" class="text-[10px] font-bold bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700">0</span>
            </div>
            <div id="mWoList" class="space-y-2.5">
                <!-- Skeleton loader -->
                <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700/50 animate-pulse space-y-2">
                    <div class="h-4 bg-slate-700 rounded w-2/3"></div>
                    <div class="h-3 bg-slate-700/60 rounded w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- WORK ORDER DETAIL / LABOUR COMMIT SHEET (POPUP MODAL) -->
        <div id="mWoSheet" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex flex-col justify-end">
            <div class="bg-slate-900 border-t border-slate-700 rounded-t-3xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
                
                <!-- Sheet Header -->
                <div class="px-5 py-3.5 bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700/80 flex items-center justify-between shrink-0">
                    <div class="min-w-0 flex-1 pr-2">
                        <span id="mSheetStatusBadge" class="inline-block text-[9px] font-black uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-0.5">Active</span>
                        <h3 id="mSheetTitle" class="text-sm font-bold text-white truncate leading-tight">Work Order Title</h3>
                    </div>
                    <button onclick="closeWoSheet()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm active-scale">✕</button>
                </div>

                <!-- Sheet Scrollable Form Content -->
                <div class="overflow-y-auto touch-scroll p-4 space-y-4 flex-1 text-xs">

                    <!-- Description edit -->
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Work Order Description</label>
                        <textarea id="mWoDesc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-teal-400"></textarea>
                    </div>

                    <!-- Zone Assignment Inside Modal -->
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Assigned Zone / Workshop</label>
                        <select id="mWoSheetZone" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-teal-300 font-bold focus:outline-none focus:border-teal-400">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- Progress Slider -->
                    <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700/80 space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="text-[10px] font-bold uppercase text-teal-400">Work Progress</label>
                            <span id="mProgressVal" class="text-sm font-black text-teal-300">0%</span>
                        </div>
                        <input type="range" id="mProgressInput" min="0" max="100" step="5" value="0" oninput="onProgressChange(this.value)" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-teal-400">
                        <div class="grid grid-cols-5 gap-1.5 pt-1">
                            <button onclick="onProgressChange(0)" class="py-1 rounded bg-slate-700/80 hover:bg-slate-700 text-[10px] font-bold text-slate-300">0%</button>
                            <button onclick="onProgressChange(25)" class="py-1 rounded bg-slate-700/80 hover:bg-slate-700 text-[10px] font-bold text-slate-300">25%</button>
                            <button onclick="onProgressChange(50)" class="py-1 rounded bg-slate-700/80 hover:bg-slate-700 text-[10px] font-bold text-slate-300">50%</button>
                            <button onclick="onProgressChange(75)" class="py-1 rounded bg-slate-700/80 hover:bg-slate-700 text-[10px] font-bold text-slate-300">75%</button>
                            <button onclick="onProgressChange(100)" class="py-1 rounded bg-teal-600/80 hover:bg-teal-600 text-[10px] font-bold text-white">100%</button>
                        </div>
                    </div>

                    <!-- Status & Priority -->
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Status</label>
                            <select id="mWoStatus" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400 font-semibold">
                                <option value="Active">🟢 Active</option>
                                <option value="Pending">🟡 Pending</option>
                                <option value="Hold">⏸️ On Hold</option>
                                <option value="Completed">✅ Completed</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Priority</label>
                            <select id="mWoPriority" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400 font-semibold">
                                <option value="Routine">Routine</option>
                                <option value="High">High</option>
                                <option value="Urgent">⚠️ Urgent</option>
                                <option value="Emergency">🚨 Emergency</option>
                            </select>
                        </div>
                    </div>

                    <!-- Authority, Budget & Duration -->
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Authority</label>
                            <input type="text" id="mWoAuthority" placeholder="CCED(E)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Budget (Rs)</label>
                            <input type="number" id="mWoBudget" placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Days</label>
                            <input type="number" id="mWoDuration" placeholder="Days" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                        </div>
                    </div>

                    <!-- In-Charge & Supervisor -->
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">In-Charge</label>
                            <select id="mWoIncharge" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                                <option value="">-- None --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Supervisor</label>
                            <select id="mWoSupervisor" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                                <option value="">-- None --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Project Artificer -->
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Project Artificer</label>
                        <select id="mWoArtificer" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-teal-400">
                            <option value="">-- None --</option>
                        </select>
                    </div>

                    <!-- DAILY CREW / SAILORS ASSIGNMENT SECTION -->
                    <div class="p-3.5 bg-slate-800/90 rounded-2xl border border-slate-700 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="text-sm">👥</span>
                                <span class="text-xs font-bold text-white uppercase tracking-wider">Today's Labour Crew</span>
                            </div>
                            <button onclick="restoreCrewInSheet()" class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-1 rounded-lg font-bold hover:bg-amber-500/30 active-scale">
                                ↩️ Auto-Crew
                            </button>
                        </div>

                        <!-- Current assigned tags -->
                        <div>
                            <div class="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                                <span>Assigned Sailors:</span>
                                <span id="mAssignedCountBadge" class="font-bold text-teal-300">0 sailors</span>
                            </div>
                            <div id="mAssignedTags" class="flex flex-wrap gap-1.5 min-h-[36px] p-2 bg-slate-900/80 rounded-xl border border-slate-700/60">
                                <span class="text-slate-500 text-[11px] italic py-0.5">No sailors assigned yet</span>
                            </div>
                        </div>

                        <!-- Sailor quick-search & add list -->
                        <div class="pt-2 border-t border-slate-700/60 space-y-2">
                            <div class="flex items-center justify-between text-[10px]">
                                <span class="font-bold uppercase tracking-wider text-slate-400">Add Sailors to Crew</span>
                                <span id="mSailorPoolCount" class="font-semibold text-slate-400"></span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <input type="text" id="mSailorSearch" oninput="filterSailorsForAssignment()" placeholder="Search sailors to add (Rate, Name)..." class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-teal-400">
                                <button type="button" id="mToggleAvailFilter" onclick="toggleSailorFilterMode()" class="px-2.5 py-1.5 rounded-xl border text-[10px] font-bold whitespace-nowrap transition-all bg-slate-800 text-teal-300 border-slate-700 hover:bg-slate-700 active-scale">
                                    All
                                </button>
                            </div>
                            
                            <div id="mSailorQuickPicker" class="max-h-52 overflow-y-auto touch-scroll divide-y divide-slate-700/40 bg-slate-900/60 rounded-xl border border-slate-700/60">
                                <!-- Dynamic sailors -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sticky Bottom Action Bar -->
                <div class="p-3.5 bg-slate-900 border-t border-slate-800 flex gap-2 shrink-0">
                    <button id="mBtnSaveOnly" onclick="saveWoSheet(false)" class="px-3.5 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs border border-slate-700 active-scale">
                        💾 Save
                    </button>
                    <button id="mBtnProceed" onclick="proceedWoSheet()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-xs shadow-lg shadow-emerald-950/40 flex items-center justify-center gap-1.5 active-scale">
                        <span>🚀</span> Commit Daily Labour
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="mToast" class="fixed bottom-4 left-4 right-4 z-50 p-3 rounded-2xl bg-slate-900/95 border border-teal-500/40 text-white text-xs font-bold shadow-2xl flex items-center gap-2 transform translate-y-24 transition-transform duration-200 pointer-events-none">
        <span id="mToastIcon">✅</span>
        <span id="mToastMsg" class="flex-1">Notification</span>
    </div>

    <!-- SCRIPT INCLUSION -->
    <script src="mobile.js?v=1.0.2"></script>
</body>
</html>
