<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Civil Panel Mobile App - SLN</title>
    <meta name="theme-color" content="#0a1628">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: #060b14;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #mobileAppFrameWrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f1d35 0%, #060b14 100%);
        }
        iframe#mobileAppIframe {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background: #f4f6fa;
        }
        .mobile-control-bar {
            background: #091322;
            border-bottom: 1px solid rgba(20, 184, 166, 0.25);
            height: 44px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- Sleek Compact Simulator Toolbar -->
    <div class="mobile-control-bar text-white">
        <div class="flex items-center gap-2">
            <a href="index.html" class="w-7 h-7 rounded-lg bg-teal-900/60 hover:bg-teal-700 text-teal-300 hover:text-white flex items-center justify-center text-xs transition-all border border-teal-600/30" title="Return to Desktop View">
                <i class="fa-solid fa-desktop"></i>
            </a>
            <div class="flex items-center gap-1.5">
                <span class="text-sm">📱</span>
                <span class="text-xs font-bold text-teal-300 tracking-wide">Mobile Simulator</span>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <!-- Preset Device Selector -->
            <select id="devicePresetSelect" onchange="changeDevicePreset(this.value)" class="bg-slate-900 border border-teal-500/40 text-teal-300 text-xs font-bold rounded-lg px-2.5 py-1 outline-none cursor-pointer">
                <option value="393px">🍎 iPhone 14/15 (393px)</option>
                <option value="360px">📱 Compact Phone (360px)</option>
                <option value="412px">🤖 Galaxy / Pixel (412px)</option>
                <option value="100%">📱 100% Full Viewport</option>
                <option value="768px">📟 Tablet / iPad (768px)</option>
            </select>

            <!-- Rotate Orientation Button -->
            <button onclick="toggleOrientation()" id="btnRotateOrientation" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs border border-slate-700/50" title="Rotate Phone Screen">
                <i class="fa-solid fa-rotate"></i>
            </button>

            <!-- Refresh Frame -->
            <button onclick="reloadMobileFrame()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs border border-slate-700/50" title="Reload Frame">
                <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>
        </div>
    </div>

    <!-- Mobile View Container -->
    <div id="mobileAppFrameWrapper" class="p-0 md:p-3">
        <div id="deviceMockupContainer" class="w-full h-full max-w-full transition-all duration-300 shadow-2xl flex flex-col bg-white overflow-hidden rounded-none md:rounded-[36px] border-0 md:border-[10px] md:border-slate-800" style="max-width: 393px; height: 852px; margin: auto;">
            <iframe id="mobileAppIframe" src="index.html?mobile=true" class="w-full h-full flex-1"></iframe>
        </div>
    </div>

    <script>
        let isLandscape = false;
        let currentWidth = "393px";

        function changeDevicePreset(width) {
            currentWidth = width;
            const container = document.getElementById("deviceMockupContainer");
            if (!container) return;

            if (width === "100%") {
                container.style.width = "100%";
                container.style.maxWidth = "100%";
                container.style.height = "100%";
                container.style.margin = "0";
                container.className = "w-full h-full max-w-full shadow-2xl flex flex-col bg-white overflow-hidden rounded-none border-0";
            } else {
                const targetW = isLandscape ? "844px" : width;
                const targetH = isLandscape ? width : (width === "768px" ? "1024px" : "844px");
                container.style.width = targetW;
                container.style.maxWidth = targetW;
                container.style.height = targetH;
                container.style.margin = "auto";
                container.className = "transition-all duration-300 shadow-2xl flex flex-col bg-white overflow-hidden rounded-[36px] border-[10px] border-slate-800";
            }
        }

        function toggleOrientation() {
            isLandscape = !isLandscape;
            const btn = document.getElementById("btnRotateOrientation");
            if (btn) btn.classList.toggle("text-teal-400", isLandscape);
            changeDevicePreset(currentWidth);
        }

        function reloadMobileFrame() {
            const iframe = document.getElementById("mobileAppIframe");
            if (iframe) {
                iframe.src = iframe.src;
            }
        }
    </script>
</body>
</html>
